<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viomatics Motors</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #0b0b0b;
      color: #fff;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 60px;
      background: rgba(0,0,0,0.8);
      position: sticky;
      top: 0;
      backdrop-filter: blur(10px);
      z-index: 1000;
    }

    header h1 {
      color: #00e5ff;
      font-weight: 700;
      letter-spacing: 2px;
    }

    nav a {
      margin-left: 25px;
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      transition: 0.3s;
    }

    nav a:hover {
      color: #00e5ff;
    }

    .hero {
      text-align: center;
      padding: 120px 20px;
      background: radial-gradient(circle at top, #111, #000);
    }

    .hero img {
      width: 170px;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .hero h2 {
      font-size: 52px;
      font-weight: 700;
    }

    .hero p {
      margin-top: 10px;
      font-size: 20px;
      color: #aaa;
    }

    .btn {
      display: inline-block;
      margin-top: 30px;
      padding: 14px 30px;
      background: #00e5ff;
      color: #000;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s;
    }

    .btn:hover {
      background: #00bcd4;
      transform: scale(1.05);
    }

    .services {
      padding: 80px 20px;
      text-align: center;
    }

    .services h2 {
      font-size: 36px;
      margin-bottom: 50px;
    }

    .service-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .service-box {
      width: 260px;
      padding: 25px;
      background: linear-gradient(145deg, #1a1a1a, #111);
      border-radius: 15px;
      transition: 0.4s;
      box-shadow: 0 0 10px rgba(0,229,255,0.1);
    }

    .service-box:hover {
      transform: translateY(-10px) scale(1.03);
      box-shadow: 0 0 20px rgba(0,229,255,0.3);
    }
