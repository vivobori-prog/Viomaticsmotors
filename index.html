<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viomatics Motors</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{background:#000;color:white;overflow-x:hidden;}

/* HEADER */
header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(0,0,0,0.7);
    backdrop-filter:blur(10px);
    padding:15px 40px;
    display:flex;
    align-items:center;
}

header img{
    width:60px;
    position:absolute;
    left:50%;
    transform:translateX(-50%);
}

nav{margin-left:auto;}
nav a{margin-left:20px;color:white;text-decoration:none;transition:0.3s;}
nav a:hover{color:#ffd000;}

.call-btn{
    margin-left:20px;
    padding:8px 18px;
    background:#ffd000;
    color:black;
    border-radius:20px;
    text-decoration:none;
    font-weight:600;
}

/* HERO SIMPLE CLEAN BACKGROUND */
.hero{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:linear-gradient(135deg,#000,#111);
}

.hero-content{
    padding:20px;
}

.hero h1{
    font-size:55px;
    color:#ffd000;
}

.hero p{
    color:#ddd;
    margin-top:10px;
}

.btn{
    margin-top:40px; /* moved slightly down */
    padding:14px 35px;
    background:#ffd000;
    color:black;
    border-radius:30px;
    text-decoration:none;
}

/* SERVICES */
.services{padding:80px 20px;text-align:center;}
.services h2{margin-bottom:40px;font-size:36px;color:#ffd000;}

.service-container{display:flex;justify-content:center;gap:25px;flex-wrap:wrap;}

.card{
    background:#111;
    padding:30px;
    border-radius:15px;
    width:220px;
    transition:0.4s;
}

.card:hover{transform:scale(1.1);}

footer{text-align:center;padding:20px;background:#111;color:#888;}

/* MOBILE OPTIMIZATION */
@media(max-width:768px){

header{
    padding:10px 15px;
}

header img{
    width:45px;
}

nav a{
    margin-left:10px;
    font-size:14px;
}

.call-btn{
    padding:6px 10px;
    font-size:12px;
}

.hero h1{
    font-size:32px;
}

.hero p{
    font-size:14px;
}

.btn{
    padding:10px 20px;
    font-size:14px;
    margin-top:30px;
}

.card{
    width:90%;
}
}
</style>
</head>

<body>

<header>
<img src="logo.png" alt="logo">
<nav>
<a href="#">Home</a>
<a href="#services">Services</a>
<a href="tel:8638939143" class="call-btn">Call Now</a>
</nav>
</header>

<section class="hero">
<div class="hero-content">
<h1>VIOMATICS MOTORS</h1>
<p>Tyre • Wash • Fuel Services</p>
<a href="#services" class="btn">Explore Services</a>
</div>
</section>

<section class="services" id="services">
<h2>Our Services</h2>
<div class="service-container">
<div class="card">Tyre Service</div>
<div class="card">Car Washing</div>
<div class="card">Fuel Service</div>
</div>
</section>

<footer>
<p>© 2026 Viomatics Motors</p>
</footer>

</body>
</html>
