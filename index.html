<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viomatics Motors</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
    background:linear-gradient(135deg,#000,#111,#000);
    color:white;
    overflow-x:hidden;
}

/* HEADER */
header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(0,0,0,0.7);
    backdrop-filter:blur(10px);
    padding:15px 40px;
    display:flex;
    align-items:center;
}

header img{
    width:60px;
    position:absolute;
    left:50%;
    transform:translateX(-50%);
}

nav{margin-left:auto;}
nav a{margin-left:20px;color:white;text-decoration:none;transition:0.3s;}
nav a:hover{color:#ffd000;}

.call-btn{
    margin-left:20px;
    padding:8px 18px;
    background:#ffd000;
    color:black;
    border-radius:20px;
    text-decoration:none;
    font-weight:600;
}

/* HERO */
.hero{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.hero-content{padding:20px;}

.hero h1{
    font-size:60px;
    color:#ffd000;
    text-shadow:
        0 0 3px #ffd000,
        0 0 6px #ffd000,
        0 0 12px #ffcc00;
}

.hero p{
    color:#ccc;
    margin-top:15px;
    font-size:18px;
}

/* IMAGE SECTION */
.gallery{
    padding:60px 20px;
    text-align:center;
}

.gallery h2{
    color:#ffd000;
    margin-bottom:30px;
}

.gallery img{
    width:90%;
    max-width:800px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(255,208,0,0.3);
}

/* SERVICES */
.services{padding:80px 20px;text-align:center;}
.services h2{margin-bottom:40px;font-size:36px;color:#ffd000;}

.service-container{display:flex;justify-content:center;gap:25px;flex-wrap:wrap;}

.card{
    background:#111;
    padding:30px;
    border-radius:15px;
    width:220px;
    transition:0.4s;
    box-shadow:0 0 10px rgba(255,208,0,0.1);
}

.card:hover{
    transform:scale(1.1);
    box-shadow:0 0 25px rgba(255,208,0,0.6);
}

/* WHY SECTION */
.why{
    padding:60px 20px;
    text-align:center;
}

.why h2{
    color:#ffd000;
}

.why p{
    margin-top:15px;
    color:#aaa;
    line-height:1.8;
}

/* CONTACT */
.contact{
    padding:60px 20px;
    text-align:center;
}

.contact h2{
    color:#ffd000;
}

.contact p{
    margin-top:10px;
    color:#ccc;
}

footer{text-align:center;padding:20px;background:#111;color:#888;}

/* MOBILE */
@media(max-width:768px){
.hero h1{font-size:34px;}
.hero p{font-size:14px;}
.card{width:90%;}
}
</style>
</head>

<body>

<header>
<img src="logo.png" alt="logo">
<nav>
<a href="#">Home</a>
<a href="#services">Services</a>
<a href="tel:8638939143" class="call-btn">Call Now</a>
</nav>
</header>

<section class="hero">
<div class="hero-content">
<h1>VIOMATICS MOTORS</h1>
<p>Tyre • Wash • Fuel Services</p>
</div>
</section>

<section class="gallery">
<h2>Our Work</h2>
<img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7">
</section>

<section class="services" id="services">
<h2>Our Services</h2>
<div class="service-container">
<div class="card">🚗<br><br>Tyre Service</div>
<div class="card">🧼<br><br>Car Washing</div>
<div class="card">⛽<br><br>Fuel Service</div>
</div>
</section>

<section class="why">
<h2>Why Choose Us</h2>
<p>
✔ Fast Service <br>
✔ Affordable Pricing <br>
✔ Trusted by Customers <br>
</p>
</section>

<section class="contact">
<h2>Contact Us</h2>
<p>📞 8638939143</p>
<p>📍 Guwahati</p>
</section>

<footer>
<p>© 2026 Viomatics Motors</p>
</footer>

</body>
</html>
