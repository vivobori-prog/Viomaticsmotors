<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viomatics Motors</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{background:#000;color:white;overflow-x:hidden;}

/* HEADER */
header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(0,0,0,0.7);
    backdrop-filter:blur(10px);
    padding:15px 40px;
    display:flex;
    align-items:center;
}

header img{
    width:60px;
    position:absolute;
    left:50%;
    transform:translateX(-50%);
}

nav{margin-left:auto;}
nav a{margin-left:20px;color:white;text-decoration:none;transition:0.3s;}
nav a:hover{color:#ffd000;}

.call-btn{
    margin-left:20px;
    padding:8px 18px;
    background:#ffd000;
    color:black;
    border-radius:20px;
    text-decoration:none;
    font-weight:600;
}

/* HERO WITH ANIMATED SLIDESHOW */
.hero{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
    overflow:hidden;
}

.slide{
    position:absolute;
    width:100%;
    height:100%;
    background-size:cover;
    background-position:center;
    animation:slideShow 15s infinite;
    opacity:0;
}

.slide:nth-child(1){background-image:url('https://images.unsplash.com/photo-1503376780353-7e6692767b70'); animation-delay:0s;}
.slide:nth-child(2){background-image:url('https://images.unsplash.com/photo-1493238792000-8113da705763'); animation-delay:5s;}
.slide:nth-child(3){background-image:url('https://images.unsplash.com/photo-1511919884226-fd3cad34687c'); animation-delay:10s;}

@keyframes slideShow{
    0%{opacity:0;}
    10%{opacity:1;}
    30%{opacity:1;}
    40%{opacity:0;}
    100%{opacity:0;}
}

.hero-content{
    position:relative;
    z-index:2;
}

.hero h1{font-size:55px;color:#ffd000;}
.hero p{color:#ddd;margin-top:10px;}

.btn{
    margin-top:25px;
    padding:14px 35px;
    background:#ffd000;
    color:black;
    border-radius:30px;
    text-decoration:none;
}

/* SERVICES */
.services{padding:80px 20px;text-align:center;}
.services h2{margin-bottom:40px;font-size:36px;color:#ffd000;}

.service-container{display:flex;justify-content:center;gap:25px;flex-wrap:wrap;}

.card{
    background:#111;
    padding:30px;
    border-radius:15px;
    width:220px;
    transition:0.4s;
}

.card:hover{transform:scale(1.1);}

/* GOOGLE MAP */
.map{
    padding:50px;
    text-align:center;
}

.map iframe{
    width:100%;
    height:300px;
    border:0;
    border-radius:10px;
}

footer{text-align:center;padding:20px;background:#111;color:#888;}

@media(max-width:768px){
.hero h1{font-size:35px;}
}
</style>
</head>

<body>

<header>
<img src="logo.png" alt="logo">
<nav>
<a href="#">Home</a>
<a href="#services">Services</a>
<a href="#map">Location</a>
<a href="tel:8638939143" class="call-btn">Call Now</a>
</nav>
</header>

<section class="hero">
<div class="slide"></div>
<div class="slide"></div>
<div class="slide"></div>

<div class="hero-content">
<h1>VIOMATICS MOTORS</h1>
<p>Tyre • Wash • Fuel Services</p>
<a href="#services" class="btn">Explore Services</a>
</div>
</section>

<section class="services" id="services">
<h2>Our Services</h2>
<div class="service-container">
<div class="card">Tyre Service</div>
<div class="card">Car Washing</div>
<div class="card">Fuel Service</div>
</div>
</section>

<section class="map" id="map">
<h2 style="color:#ffd000; margin-bottom:20px;">Our Location</h2>
<iframe src="https://maps.google.com/maps?q=guwahati&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
</section>

<footer>
<p>© 2026 Viomatics Motors</p>
</footer>

</body>
</html>
