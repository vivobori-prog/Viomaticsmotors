<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viomatics Motors</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#000;
    color:white;
    overflow-x:hidden;
}

/* HEADER */
header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(0,0,0,0.8);
    backdrop-filter:blur(10px);
    padding:15px 40px;

    display:flex;
    align-items:center;
}

/* CENTER LOGO */
header img{
    width:60px;
    position:absolute;
    left:50%;
    transform:translateX(-50%);
}

/* NAV RIGHT */
nav{
    margin-left:auto;
}

nav a{
    margin-left:20px;
    color:white;
    text-decoration:none;
    transition:0.3s;
    font-weight:500;
}

nav a:hover{
    color:#ffd000;
}

/* CALL BUTTON */
.call-btn{
    margin-left:20px;
    padding:8px 18px;
    background:#ffd000;
    color:black;
    border-radius:20px;
    text-decoration:none;
    font-weight:600;
    transition:0.3s;
}

.call-btn:hover{
    background:#ffb800;
}

/* HERO */
.hero{
    height:90vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:radial-gradient(circle at top,#111,#000);
    animation:fadeIn 1.5s ease;
}

.hero h1{
    font-size:55px;
    font-weight:700;
    color:#ffd000;
}

.hero p{
    color:#aaa;
    margin-top:10px;
}

.btn{
    margin-top:25px;
    padding:14px 35px;
    background:#ffd000;
    color:black;
    border-radius:30px;
    text-decoration:none;
    font-weight:600;
    transition:0.4s;
}

.btn:hover{
    transform:scale(1.1);
    background:#ffb800;
}

/* SERVICES */
.services{
    padding:80px 20px;
    text-align:center;
}

.services h2{
    margin-bottom:40px;
    font-size:36px;
    color:#ffd000;
}

.service-container{
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
}

.card{
    background:linear-gradient(145deg,#1a1a1a,#0f0f0f);
    padding:30px;
    border-radius:15px;
    width:220px;
    transition:0.4s;
    box-shadow:0 0 10px rgba(255,208,0,0.1);
}

.card:hover{
    transform:translateY(-10px) scale(1.05);
    box-shadow:0 0 25px rgba(255,208,0,0.5);
}

/* FOOTER */
footer{
    text-align:center;
    padding:20px;
    background:#111;
    color:#888;
}

/* ANIMATION */
@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);} 
    to{opacity:1; transform:translateY(0);} 
}

/* MOBILE */
@media(max-width:768px){
    .hero h1{
        font-size:35px;
    }

    header{
        padding:15px 20px;
    }

    nav a{
        margin-left:10px;
    }

    .call-btn{
        padding:6px 12px;
    }
}
</style>
</head>

<body>

<header>
<img src="logo.PNG" alt="logo">

<nav>
<a href="#">Home</a>
<a href="#services">Services</a>
<a href="tel:8638939143" class="call-btn">Call Now</a>
</nav>
</header>

<section class="hero">
<h1>VIOMATICS MOTORS</h1>
<p>Tyre • Wash • Fuel Services</p>
<a href="#services" class="btn">Explore Services</a>
</section>

<section class="services" id="services">
<h2>Our Services</h2>

<div class="service-container">
<div class="card">Tyre Service</div>
<div class="card">Car Washing</div>
<div class="card">Fuel Service</div>
</div>

</section>

<footer>
<p>© 2026 Viomatics Motors</p>
</footer>

</body>
</html>
