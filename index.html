<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viomatics Motors</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{background:linear-gradient(135deg,#000,#111,#000);color:white;overflow-x:hidden;}

header{
position:sticky;top:0;z-index:1000;
background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);
padding:15px 40px;display:flex;align-items:center;
}
header img{width:60px;position:absolute;left:50%;transform:translateX(-50%);}
nav{margin-left:auto;}
nav a{margin-left:20px;color:white;text-decoration:none;transition:0.3s;}
nav a:hover{color:#ffd000;}
.call-btn{margin-left:20px;padding:8px 18px;background:#ffd000;color:black;border-radius:20px;text-decoration:none;font-weight:600;}

.hero{height:100vh;display:flex;justify-content:center;align-items:center;text-align:center;}
.hero h1{font-size:60px;color:#ffd000;text-shadow:0 0 5px #ffd000;}
.hero p{color:#ccc;margin-top:15px;}

.gallery{padding:60px 20px;text-align:center;}
.gallery h2{color:#ffd000;margin-bottom:30px;}
.gallery img{width:90%;max-width:800px;border-radius:15px;}

.services{padding:80px 20px;text-align:center;}
.services h2{margin-bottom:40px;color:#ffd000;}
.service-container{display:flex;justify-content:center;gap:25px;flex-wrap:wrap;}
.card{background:#111;padding:30px;border-radius:15px;width:220px;cursor:pointer;transition:0.4s;}
.card:hover{transform:scale(1.1);box-shadow:0 0 20px #ffd000;}

/* FORM */
.form-modal{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.85);
display:flex;justify-content:center;align-items:center;
opacity:0;visibility:hidden;transition:0.4s;
}
.form-modal.active{opacity:1;visibility:visible;}

.form-box{
background:#111;padding:30px;border-radius:15px;width:90%;max-width:400px;
transform:scale(0.8);transition:0.4s;
}
.form-modal.active .form-box{transform:scale(1);}

.close-btn{position:absolute;top:20px;right:25px;cursor:pointer;}

.form-box h2{color:#ffd000;text-align:center;margin-bottom:20px;}

.form-box input,.form-box select{
width:100%;padding:10px;margin:10px 0;border:none;border-radius:8px;
}

.submit-btn{
width:100%;padding:12px;background:#ffd000;border:none;border-radius:20px;font-weight:600;cursor:pointer;
}

.loading,.success{text-align:center;color:#ffd000;margin-top:10px;display:none;}

footer{text-align:center;padding:20px;background:#111;color:#888;}

.whatsapp-float{
position:fixed;bottom:20px;right:20px;background:#25D366;
width:55px;height:55px;border-radius:50%;
display:flex;align-items:center;justify-content:center;
font-size:26px;cursor:pointer;
}

@media(max-width:768px){.hero h1{font-size:34px;}.card{width:90%;}}
</style>
</head>

<body>

<header>
<img src="logo.png">
<nav>
<a href="#">Home</a>
<a href="#services">Services</a>
<a href="tel:8638939143" class="call-btn">Call Now</a>
</nav>
</header>

<section class="hero">
<div>
<h1>VIOMATICS MOTORS</h1>
<p>Tyre • Wash • Fuel Services</p>
</div>
</section>

<section class="gallery">
<h2>Our Work</h2>
<img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7">
</section>

<section class="services" id="services">
<h2>Our Services</h2>
<div class="service-container">
<div class="card" onclick="openForm('tyre')">Tyre Service</div>
<div class="card" onclick="openForm('wash')">Car Washing</div>
<div class="card" onclick="openForm('fuel')">Fuel Service</div>
</div>
</section>

<!-- FORM -->
<div class="form-modal" id="formModal">
<div class="form-box">
<span class="close-btn" onclick="closeForm()">✖</span>

<h2 id="formTitle">Book Service</h2>

<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<input id="date" type="date">
<input id="time" type="time">

<select id="home" onchange="toggleLocation()">
<option value="">Select Option</option>
<option value="Yes">Yes (Home Service)</option>
<option value="No">No (Visit Shop)</option>
</select>

<button id="submitBtn" class="submit-btn" onclick="submitForm()">Submit</button>

<button id="locBtn" class="submit-btn" 
style="margin-top:10px;background:#222;color:#ffd000;display:none;" 
onclick="getLocation()">Use My Location</button>

<div class="loading" id="loadingMsg">Sending...</div>
<div class="success" id="distanceMsg"></div>
<div class="success" id="priceMsg"></div>
<div class="success" id="successMsg">Booking Sent!</div>

</div>
</div>

<footer>
<p>© 2026 Viomatics Motors</p>
</footer>

<div class="whatsapp-float" onclick="openWhatsApp()">💬</div>

<script>
let currentService='';
let userLocation='';
let userDistance=0;

// OPEN FORM
function openForm(type){
currentService=type;
document.getElementById('formModal').classList.add('active');

if(type==='tyre') document.getElementById('formTitle').innerText='Book Tyre Service';
if(type==='wash') document.getElementById('formTitle').innerText='Book Washing';
if(type==='fuel') document.getElementById('formTitle').innerText='Emergency Fuel';
}

// CLOSE
function closeForm(){
document.getElementById('formModal').classList.remove('active');
}

// SHOW/HIDE LOCATION BUTTON
function toggleLocation(){
let home=document.getElementById('home').value;

if(home==='Yes'){
document.getElementById('locBtn').style.display='block';
}else{
document.getElementById('locBtn').style.display='none';
userLocation='';
document.getElementById('distanceMsg').style.display='none';
document.getElementById('priceMsg').style.display='none';
}
}

// GET LOCATION (NO LIMIT)
function getLocation(){
navigator.geolocation.getCurrentPosition(function(pos){

let lat=pos.coords.latitude;
let lon=pos.coords.longitude;
userLocation=lat+','+lon;

const shopLat=26.18;
const shopLon=91.78;

function distance(lat1,lon1,lat2,lon2){
let R=6371;
let dLat=(lat2-lat1)*Math.PI/180;
let dLon=(lon2-lon1)*Math.PI/180;
let a=Math.sin(dLat/2)**2+
Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)**2;
return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

userDistance=distance(shopLat,shopLon,lat,lon);

document.getElementById('distanceMsg').innerText='Distance: '+userDistance.toFixed(2)+' km';
document.getElementById('distanceMsg').style.display='block';

document.getElementById('priceMsg').innerText='Delivery charge may vary';
document.getElementById('priceMsg').style.display='block';

});
}

// SUBMIT
function submitForm(){

let name=document.getElementById('name').value;
let phone=document.getElementById('phone').value;
let date=document.getElementById('date').value;
let time=document.getElementById('time').value;
let home=document.getElementById('home').value;

if(!name||!phone||!date||!time||!home){
alert('Fill all fields');
return;
}

if(home==='Yes' && !userLocation){
alert('Please use location for home service');
return;
}

document.getElementById('loadingMsg').style.display='block';

let serviceName='';
if(currentService==='tyre') serviceName='Tyre Service';
if(currentService==='wash') serviceName='Car Washing';
if(currentService==='fuel') serviceName='Fuel Service';

let msg=`New Booking:
Service: ${serviceName}
Name: ${name}
Phone: ${phone}
Date: ${date}
Time: ${time}
Home Service: ${home}
${userLocation ? "Location: https://maps.google.com/?q="+userLocation : ""}`;

window.open(`https://wa.me/918638939143?text=${encodeURIComponent(msg)}`,'_blank');

setTimeout(()=>{
document.getElementById('loadingMsg').style.display='none';
document.getElementById('successMsg').style.display='block';
setTimeout(()=>{
closeForm();
document.getElementById('successMsg').style.display='none';
},2000);
},1000);
}

// WHATSAPP
function openWhatsApp(){
window.open('https://wa.me/918638939143','_blank');
}
</script>

</body>
</html>
