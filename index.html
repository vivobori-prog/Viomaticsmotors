<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viomatics Motors</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #0b0b0b;
    color: white;
}

header {
    background: #111;
    padding: 15px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
}

.hero {
    text-align: center;
    padding: 50px 20px;
}

.hero h1 {
    font-size: 40px;
    color: #00ffcc;
}

.services {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 20px;
    flex-wrap: wrap;
}

.card {
    background: #1a1a1a;
    padding: 20px;
    border-radius: 10px;
    width: 200px;
    text-align: center;
}

.card:hover {
    background: #222;
}

.form-section {
    padding: 30px;
    text-align: center;
}

input, select, button {
    padding: 10px;
    margin: 10px;
    border-radius: 5px;
    border: none;
}

button {
    background: #00ffcc;
    color: black;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #00ccaa;
}
</style>
</head>

<body>

<header>
Viomatics Motors 
</header>

<div class="hero">
<h1>Book Your Car Service</h1>
<p>Fast • Reliable • Professional</p>
</div>

<div class="services">
<div class="card">Oil Change</div>
<div class="card">Car Wash</div>
<div class="card">Engine Repair</div>
<div class="card">Full Service</div>
</div>

<div class="form-section">
<h2>Book Appointment</h2>

<form>
<input type="text" placeholder="Your Name" required><br>
<input type="tel" placeholder="Phone Number" required><br>

<select required>
<option value="">Select Service</option>
<option>Oil Change</option>
<option>Car Wash</option>
<option>Engine Repair</option>
<option>Full Service</option>
</select><br>

<input type="date" required><br>

<button type="submit">Book Now</button>
</form>

</div>

</body>
</html>
